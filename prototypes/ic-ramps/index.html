<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f4">
  <meta name="robots" content="noindex,nofollow">
  <title>ICランプ図 · KP Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <a id="back-link" class="back-link" href="/viewer.html?route=e28"><span aria-hidden="true">←</span> 路線図</a>
    <a class="brand" href="/viewer.html?route=e28">KP <span>Viewer</span></a>
    <span class="prototype-badge">BETA</span>
  </header>
  <main class="workspace">
    <section class="ic-heading">
      <p class="eyebrow"><span class="route-shield" id="route-shield">E28</span> <span id="route-label">神戸淡路鳴門自動車道</span></p>
      <div class="heading-row"><h1 id="ic-name">津名一宮IC</h1><span class="kp-badge" id="ic-kp">44.4 <small>KP</small></span></div>
      <p class="subtitle" id="page-subtitle">ランプを選択</p>
    </section>

    <section class="map-panel" aria-label="ICの上空地図とランプ線形">
      <div id="map"></div>
      <div class="map-toolbar">
        <div class="segmented" role="group" aria-label="背景地図">
          <button id="map-base" class="active" aria-pressed="true">地図</button>
          <button id="map-lines" aria-pressed="false">線形のみ</button>
        </div>
        <button id="fit-map" class="map-action" title="IC全体を表示" aria-label="IC全体を表示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5m6 0h5v5M4 15v5h5m6 0h5v-5"/></svg></button>
      </div>
      <div class="map-hint"><span class="hint-dot"></span> 線をタップ</div>
      <div class="north-arrow" aria-label="地図の上が北">N<span>↑</span></div>
      <p id="map-error" class="map-error" hidden></p>
    </section>

    <section class="ramp-panel" aria-label="ランプを選択">
      <div class="section-heading"><h2 id="section-title">ランプ</h2><span id="ramp-count">A / B / C / D</span></div>
      <div class="ramp-grid" id="ramp-list"></div>
      <section class="selection" aria-label="選択したランプ" aria-live="polite">
        <div class="selection-head"><span class="ramp-letter" id="selected-letter">A</span><div><p class="selection-kicker" id="selection-kicker">選択中</p><h3 id="selected-name">読み込み中…</h3></div><span class="length" id="selected-length"></span></div>
        <p class="travel-path" id="selected-path"></p>
        <div class="position-heading"><label for="ramp-position">位置</label><output id="position-label">中央</output></div>
        <input id="ramp-position" type="range" min="0" max="100" value="50" step="1" aria-label="ランプ内のストリートビューを見る位置">
        <div class="range-labels"><span>始点</span><span>終点</span></div>
        <a id="streetview" class="streetview-link" target="_blank" rel="noopener noreferrer" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 6-3 4 3 6-3v13l-6 3-4-3-6 3V7Zm6-3v13m4-10v13"/></svg><span>ストリートビュー</span><span class="external-arrow" aria-hidden="true">↗</span></a>
      </section>
      <details class="data-notes"><summary>データ</summary><p id="method-note">OpenStreetMapを加工した試験データです。</p><p id="source-note"></p></details>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
