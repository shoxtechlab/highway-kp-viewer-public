<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{TITLE}} | 高速道路KP Viewer</title>
  <meta name="theme-color" content="#00973a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  {{MANIFEST}}
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body{{BODY_DATA}}>
  <header id="topbar">
    <a data-parent-key="{{PARENT_KEY}}" data-parent-href="{{PARENT_HREF}}" id="app-title">
      <span class="app-title-main">KP Viewer</span>
      <span class="app-title-sub">{{TITLE}}</span>
    </a>
    <div id="route-title">{{TITLE}}</div>
  </header>
  <main class="home">
    <section class="hero">
      <p class="hero-kicker">{{KICKER}}</p>
      <h1>{{HEADING}}</h1>
      <p>{{DESCRIPTION}}</p>
    </section>
    <section class="route-panel">
      <h2>{{LIST_TITLE}}</h2>
      {{LIST_CONTENT}}
    </section>
    {{EXTRA_CONTENT}}
  </main>
  <script src="/js/portalNavigation.js" type="module"></script>
  {{SCRIPT}}
  <footer class="copyright">
    <span>© 2026 shoxtechlab. All Rights Reserved.</span>
    <span> / </span>
    <span>地図・路線形状: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors (ODbL)</a></span>
    <span> / <a href="/data-sources.html">出典・免責</a></span>
  </footer>
</body>
</html>
