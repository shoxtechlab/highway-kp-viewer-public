<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00973a">
  <meta name="robots" content="noindex,nofollow">
  <title>デモ車の操作 | KP Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><span>KP Viewer</span><h1>デモ車の操作</h1></header>
  <main>
    <form id="login" class="panel">
      <label for="key">管理者キー（共有編集と共通）</label>
      <div class="login-row"><input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required><button id="show-key" type="button" class="secondary" aria-controls="key" aria-pressed="false">表示</button><button>開く</button></div>
      <p>キーはこの画面を開いている間だけ保持します。</p>
    </form>
    <section id="controls" hidden>
      <div class="toolbar"><button id="stop-all" class="danger">全車停止</button><button id="refresh" class="secondary">状態更新</button><button id="logout" class="secondary">認証解除</button></div>
      <p>開始すると指定のKP・方向から走り直し、1時間で自動停止します。端点で折り返し、この画面を閉じても期限までは走行を続けます。</p>
      <div id="routes"></div>
      <p>路線図では「他者の公開位置」をオンにして確認してください。停止の反映には通常最大10秒程度かかります。</p>
    </section>
    <p id="notice" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
