<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00973a">
  <title>追加データ CSV→JSON変換</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span>KP Viewer</span><strong>CSV → JSON</strong></div>
    <button id="theme-toggle" class="icon-button" type="button" aria-label="ダークモードに切り替え">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
    </button>
  </header>
  <main>
    <section class="intro">
      <p class="eyebrow">LOCAL CONVERTER</p>
      <h1>追加データ CSV→JSON変換</h1>
      <p>編集モードへ読み込めるJSONをCSVから生成します。処理はすべてブラウザ内で行い、入力内容をサーバーへ送信しません。</p>
    </section>
    <section class="panel">
      <div class="section-heading"><div><span>01</span><h2>CSV入力</h2></div><button id="sample-button" class="text-button" type="button">サンプルを入力</button></div>
      <label id="drop-zone" class="drop-zone">
        <input id="file-input" type="file" accept=".csv,text/csv">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
        <b>CSVを選択またはドロップ</b><small>UTF-8 / 最大500行</small>
      </label>
      <div class="or"><span>または直接貼り付け</span></div>
      <textarea id="csv-input" rows="10" spellcheck="false" aria-label="CSV入力"></textarea>
      <p class="help">必須列: routeId, startKp, name　区間の場合: geometryType=section, endKp</p>
    </section>
    <section class="panel">
      <div class="section-heading"><div><span>02</span><h2>入力確認</h2></div><output id="row-count" class="count">0行</output></div>
      <div class="table-wrap"><table><thead id="preview-head"></thead><tbody id="preview-body"><tr><td class="empty">CSVを入力すると先頭5行を表示します。</td></tr></tbody></table></div>
      <p id="message" class="message" aria-live="polite"></p>
      <button id="convert-button" class="primary-button" type="button" disabled>JSONを生成</button>
    </section>
    <section id="result-panel" class="panel" hidden>
      <div class="section-heading"><div><span>03</span><h2>JSON出力</h2></div><output id="result-count" class="count"></output></div>
      <textarea id="json-output" rows="18" readonly aria-label="JSON出力"></textarea>
      <div class="result-actions"><button id="copy-button" class="secondary-button" type="button">コピー</button><button id="download-button" class="primary-button" type="button">JSONをダウンロード</button></div>
    </section>
  </main>
  <footer>© 2026 shoxtechlab. All Rights Reserved.</footer>
  <script src="./app.js" type="module"></script>
</body>
</html>
