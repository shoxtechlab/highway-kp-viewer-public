<!DOCTYPE html>
<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>本州四国連絡高速道路 | 高速道路KP Viewer</title>
    <meta name="theme-color" content="#00973a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="KP Viewer 本四版">

    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">

<body data-routes-src="../data/honshi-routes.json" data-offices-src="../data/honshi-offices.json" data-viewer-base="../viewer.html">

        <a href="./" id="app-title">
            <span class="app-title-main">KP Viewer</span>
            <span class="app-title-sub">本州四国連絡高速道路</span>
        </a>
        <div id="route-title">本州四国連絡高速道路</div>

    <main class="home">
        <section class="hero">
            <p class="hero-kicker">HONSHU-SHIKOKU BRIDGE EXPRESSWAY</p>
            <h1>本州四国連絡高速道路 KP Viewer</h1>

        </section>

        <section class="route-panel">
            <h2>路線一覧</h2>
            <div id="route-list" class="route-list"></div>

        <section class="route-panel">
            <h2>管理センター別表示</h2>

            <div id="office-list" class="route-list"></div>

    <script src="../js/index.js" type="module"></script>
