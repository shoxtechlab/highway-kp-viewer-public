<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>走行モード | KP Viewer</title>
    <meta name="theme-color" content="#00973a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/drive.css">
</head>
<body>
    <main id="drive-app">
        <header class="drive-header">
            <div>
                <p id="drive-route-number">---</p>
                <h1 id="drive-route-name">路線を確認中</h1>
            </div>
            <div class="drive-header-actions">
                <button id="drive-layer-toggle" type="button" aria-expanded="false" aria-controls="drive-layer-menu">表示設定</button>
                <button id="drive-stop" type="button">走行終了</button>
                <div id="drive-layer-menu" class="drive-layer-menu" hidden>
                    <strong>走行モードの表示</strong>
                    <label><input type="checkbox" data-layer="bridges">橋梁</label>
                    <label><input type="checkbox" data-layer="tunnels">トンネル</label>
                    <label><input type="checkbox" data-layer="incident">事象・事故</label>
                    <label><input type="checkbox" data-layer="construction">工事・規制</label>
                    <label><input type="checkbox" data-layer="other">その他の追加情報</label>
                </div>
            </div>
        </header>

        <section class="drive-readout" aria-live="polite">
            <div class="drive-direction" id="drive-direction">---</div>
            <div class="drive-kp"><strong id="drive-kp">--.--</strong><span>KP</span></div>
            <div class="drive-speed"><strong id="drive-speed">--</strong><span>km/h</span></div>
        </section>

        <section id="drive-road-view" aria-label="現在位置周辺の路線図">
            <div class="drive-forward">進行方向</div>
            <div class="drive-road-line"></div>
            <div id="drive-items"></div>
            <div class="drive-current-marker"><span></span><b>現在地</b></div>
            <div id="drive-view-center" hidden></div>
            <div id="drive-current-edge" hidden></div>
            <button id="drive-follow" type="button" hidden>現在地へ戻る</button>
        </section>

        <div id="drive-route-change" role="status" aria-live="polite" hidden></div>
        <p id="drive-status" role="status" aria-live="polite">現在地を取得しています。</p>
    </main>
    <dialog id="drive-offroad-dialog" class="drive-dialog">
        <h2>本線外です</h2>
        <p id="drive-offroad-message">現在地は収録路線から離れています。最寄りの路線を参考表示します。</p>
        <button id="drive-offroad-close" type="button">OK</button>
    </dialog>
    <script type="module" src="js/drive.js"></script>
</body>
</html>
